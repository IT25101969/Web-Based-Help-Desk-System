name: Help Desk CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/it25101969-auth-rbac
      - feature/it25101961-ticket-submission
      - feature/it25101968-notifications
      - feature/it25101966-reports-admin
      - feature/it25101959-ticket-handling
      - feature/it25101971-faq-guidance
      - codex/full-project-integration
      - antigravity/full-site
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: university_helpdesk
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/university_helpdesk
      DB_USERNAME: root
      DB_PASSWORD: root
      SHOW_RESET_LINK: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean test
