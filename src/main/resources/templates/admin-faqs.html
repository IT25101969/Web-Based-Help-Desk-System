<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ Administration</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="topbar"><strong>FAQ Administration</strong><div><a th:href="@{/admin/dashboard}">Dashboard</a><a th:href="@{/faq}">Published FAQ</a></div></div>
<div class="container">
<div th:if="${success}" class="alert success" th:text="${success}"></div>
<div class="card"><h1>Create FAQ</h1><form th:action="@{/admin/faqs}" method="post"><label>Question<input name="question" required maxlength="300"></label><label>Answer<textarea name="answer" rows="5" required></textarea></label><label>Category<select name="categoryId"><option value="">General</option><option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option></select></label><label>Status<select name="status"><option>DRAFT</option><option>PUBLISHED</option></select></label><button class="btn" type="submit">Create FAQ</button></form></div>
<div class="card"><h1>Manage FAQ</h1><div class="card" th:each="faq : ${faqs}"><form th:action="@{/admin/faqs/{id}(id=${faq.faqId})}" method="post"><label>Question<input name="question" th:value="${faq.question}" required></label><label>Answer<textarea name="answer" rows="4" th:text="${faq.answer}" required></textarea></label><label>Category<select name="categoryId"><option value="">General</option><option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}" th:selected="${faq.category != null and faq.category.categoryId == c.categoryId}"></option></select></label><label>Status<select name="status"><option th:each="s : ${T(com.university.helpdesk.entity.FaqStatus).values()}" th:value="${s}" th:text="${s}" th:selected="${s == faq.status}"></option></select></label><div class="actions"><button class="btn" type="submit">Save</button></div></form><form th:if="${faq.status.name() != 'ARCHIVED'}" th:action="@{/admin/faqs/{id}/archive(id=${faq.faqId})}" method="post"><button class="btn danger" type="submit">Archive</button></form></div></div>
</div></body></html>
