<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Notification Preferences - University Help Desk</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
<link rel="stylesheet" th:href="@{/css/workspace-polish.css}">
</head>
<body class="app-page refined-page preferences-page">

<header th:replace="~{fragments/topbar :: topbar('preferences')}"></header>

<div class="container">

    <div th:if="${successMessage}" class="alert success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

    <div class="page-header page-hero">
        <div>
            <span class="page-eyebrow">NOTIFICATIONS / DELIVERY</span>
            <h1 class="page-title">Notification preferences</h1>
            <p class="page-subtitle">Choose how you receive ticket updates and support alerts.</p>
        </div>
        <a th:href="@{/notifications}" class="btn secondary">&larr; Back to notifications</a>
    </div>
    <div class="card">
        <form th:action="@{/notifications/preferences}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- In-App Notifications Option -->
            <label class="pref-card" style="cursor:pointer;">
                <input type="checkbox"
                       name="inAppEnabled"
                       value="true"
                       class="pref-checkbox"
                       th:checked="${preference.inAppEnabled}" />
                <div class="pref-info">
                    <h3>In-App Portal Notifications</h3>
                    <p>
                        Display alerts directly in your portal Notification Center when your tickets are created, assigned, updated, or resolved.
                    </p>
                    <p class="preference-note">
                        <em>Note: Mandatory security and administrative system alerts will always be delivered to your portal account.</em>
                    </p>
                </div>
            </label>

            <!-- Email Notifications Option -->
            <label class="pref-card" style="cursor:pointer;">
                <input type="checkbox"
                       name="emailEnabled"
                       value="true"
                       class="pref-checkbox"
                       th:checked="${preference.emailEnabled}" />
                <div class="pref-info">
                    <h3>Email Notifications</h3>
                    <p>
                        Receive automated email updates at <strong th:text="${user.email}">user@university.edu</strong> whenever action is taken on your help desk tickets.
                    </p>
                </div>
            </label>

            <div class="refined-form-actions">
                <button type="submit" class="btn" style="padding:10px 24px;">Save Preferences</button>
                <a th:href="@{/notifications}" class="btn secondary" style="padding:10px 18px;">Cancel</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
