<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SLIIT UNI Help Desk</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <a th:replace="~{fragments/university-brand :: auth}"></a>
    <h1>Reset Password</h1>

    <div th:if="${invalidToken}" class="error">
        This password reset link is invalid, expired, or has already been used.
    </div>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:if="${invalidToken == null or !invalidToken}" th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">

        <label for="password">New Password</label>
        <input id="password" name="password" type="password"
               required minlength="8" autocomplete="new-password">

        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password"
               required minlength="8" autocomplete="new-password">

        <button type="submit" class="btn">Reset Password</button>
    </form>

    <a class="back" th:href="@{/login}">Back to Sign In</a>
</div>
</body>
</html>
