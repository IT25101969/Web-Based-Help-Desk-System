<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - University Help Desk</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 420px;
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
        }
        h1 { color: #0f172a; margin-top: 0; }
        label { display: block; margin: 16px 0 6px; font-weight: bold; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .error {
            margin: 16px 0;
            padding: 12px;
            border-radius: 6px;
            background: #fee2e2;
            color: #991b1b;
        }
        .back { display: block; margin-top: 18px; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h1>Reset Password</h1>

    <div th:if="${invalidToken}" class="error">
        This password reset link is invalid, expired, or has already been used.
    </div>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:if="${invalidToken == null or !invalidToken}" th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">

        <label for="password">New Password</label>
        <input id="password" name="password" type="password"
               required minlength="8" autocomplete="new-password">

        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password"
               required minlength="8" autocomplete="new-password">

        <button type="submit">Reset Password</button>
    </form>

    <a class="back" th:href="@{/login}">Back to Sign In</a>
</div>
</body>
</html>
