<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="topbar"><strong>FAQ & Guidance</strong><div><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/student/tickets/new}">Submit Ticket</a></div></div>
<div class="container">
<div class="card"><h1>Find a quick solution</h1><form method="get" th:action="@{/faq}"><label>Search<input name="q" th:value="${query}" placeholder="Search FAQ by keyword"></label><button class="btn" type="submit">Search</button></form></div>
<div class="card" th:each="faq : ${faqs}"><h2 th:text="${faq.question}"></h2><p th:text="${faq.answer}"></p><a th:if="${faq.category != null}" th:href="@{/student/tickets/new(categoryId=${faq.category.categoryId})}">Still need help? Submit a ticket in this category</a></div>
<div th:if="${#lists.isEmpty(faqs)}" class="card"><p>No matching FAQ was found.</p><a class="btn" th:href="@{/student/tickets/new}">Submit a Ticket</a></div>
</div></body></html>
