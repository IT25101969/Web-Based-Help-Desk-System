<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - University Help Desk</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 420px;
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
        }
        h1 { color: #0f172a; margin-top: 0; }
        p { color: #475569; }
        label { display: block; margin: 18px 0 6px; font-weight: bold; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .message {
            margin: 16px 0;
            padding: 12px;
            border-radius: 6px;
            background: #dcfce7;
            color: #166534;
        }
        .dev-link {
            margin-top: 16px;
            padding: 12px;
            background: #fef3c7;
            color: #92400e;
            border-radius: 6px;
            word-break: break-all;
        }
        .back { display: block; margin-top: 18px; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <h1>Forgot Password</h1>
    <p>Enter your University ID or university email address.</p>

    <div th:if="${message}" class="message" th:text="${message}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <label for="login">University ID / Email</label>
        <input id="login" name="login" type="text" required
               placeholder="University ID or Email">
        <button type="submit">Request Password Reset</button>
    </form>

    <div th:if="${resetLink}" class="dev-link">
        <strong>Development reset link:</strong><br>
        <a th:href="${resetLink}" th:text="${resetLink}"></a>
        <br><small>This is shown only because email delivery is not configured yet.</small>
    </div>

    <a class="back" th:href="@{/login}">Back to Sign In</a>
</div>
</body>
</html>
