<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SLIIT UNI Help Desk</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <a th:replace="~{fragments/university-brand :: auth}"></a>
    <h1>Forgot Password</h1>
    <p>Enter your University ID or university email address.</p>

    <div th:if="${message}" class="message" th:text="${message}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <label for="login">University ID / Email</label>
        <input id="login" name="login" type="text" required
               placeholder="University ID or Email" pattern=".*\S.*" title="Enter a value containing more than spaces.">
        <button type="submit" class="btn">Request Password Reset</button>
    </form>

    <div th:if="${resetLink}" class="dev-link">
        <strong>Development reset link:</strong><br>
        <a th:href="${resetLink}" th:text="${resetLink}"></a>
        <br><small>This is shown only because email delivery is not configured yet.</small>
    </div>

    <a class="back" th:href="@{/login}">Back to Sign In</a>
</div>
</body>
</html>
