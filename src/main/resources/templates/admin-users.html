<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>User Administration</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="topbar">
    <strong>User Administration</strong>
    <div>
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/reports}">Reports</a>
        <a th:href="@{/admin/monitoring}">Monitoring</a>
        <a th:href="@{/admin/activity-logs}">Activity Logs</a>
        <a th:href="@{/admin/faqs}">FAQ Admin</a>
    </div>
</div>

<div class="container">
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <div class="card">
        <h1>Create User</h1>
        <form th:action="@{/admin/users}" method="post">
            <div class="grid grid-2">
                <label>University ID
                    <input name="universityId" required placeholder="e.g. STU999 or ADM999">
                </label>
                <label>Email
                    <input name="email" type="email" required placeholder="user@university.edu">
                </label>
                <label>First name
                    <input name="firstName" required>
                </label>
                <label>Last name
                    <input name="lastName" required>
                </label>
                <label>Initial password
                    <input name="password" type="password" minlength="8" required placeholder="Minimum 8 characters">
                </label>
                <label>Role
                    <select name="roleId" required>
                        <option th:each="r : ${roles}" th:value="${r.roleId}" th:text="${r.roleName}"></option>
                    </select>
                </label>
            </div>
            <div style="margin-top: 14px;">
                <button class="btn" type="submit">Create Account</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h1>Accounts</h1>
        <table>
            <thead>
                <tr>
                    <th>User</th>
                    <th>Roles</th>
                    <th>Status</th>
                    <th>Failed Attempts</th>
                    <th>Locked Until</th>
                    <th>Last Login</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}"
                    th:style="${user.accountStatus.name() == 'LOCKED' or user.failedLoginAttempts >= 3} ? 'background: #fff1f2;' : ''">
                    <td>
                        <strong th:text="${user.universityId}"></strong>
                        <div th:if="${user.accountStatus.name() == 'LOCKED'}"
                             style="display: inline-block; background: #ef4444; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-left: 4px;">
                            SUSPICIOUS: LOCKED
                        </div>
                        <div th:if="${user.accountStatus.name() != 'LOCKED' and user.failedLoginAttempts >= 3}"
                             style="display: inline-block; background: #f59e0b; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-left: 4px;">
                            SUSPICIOUS: 3+ FAILED LOGINS
                        </div>
                        <br>
                        <span class="muted" th:text="${user.email}"></span><br>
                        <span th:text="${user.firstName + ' ' + user.lastName}"></span>
                    </td>
                    <td>
                        <div th:each="ur : ${userRolesMap[user.userId]}" style="margin-bottom: 4px; display: flex; align-items: center; gap: 4px;">
                            <span class="badge" th:text="${ur.role.roleName}"></span>
                            <form th:action="@{/admin/users/{userId}/roles/{roleId}/remove(userId=${user.userId},roleId=${ur.role.roleId})}"
                                  method="post" style="display:inline; margin: 0;">
                                <button type="submit" class="btn danger"
                                        style="padding: 1px 6px; font-size: 11px; border-radius: 4px;"
                                        title="Remove role"
                                        onclick="return confirm('Are you sure you want to remove this role?');">
                                    &times;
                                </button>
                            </form>
                        </div>
                        <div th:if="${#lists.isEmpty(userRolesMap[user.userId])}" class="muted">None</div>
                    </td>
                    <td>
                        <span th:text="${user.accountStatus}"
                              th:style="${user.accountStatus.name() == 'ACTIVE'} ? 'color: #10b981; font-weight: 700;' : (${user.accountStatus.name() == 'LOCKED'} ? 'color: #ef4444; font-weight: 700;' : 'color: #6b7280;')">
                        </span>
                    </td>
                    <td th:text="${user.failedLoginAttempts}"
                        th:style="${user.failedLoginAttempts >= 3} ? 'color: #ef4444; font-weight: 700;' : ''">
                    </td>
                    <td th:text="${user.lockedUntil != null ? #temporals.format(user.lockedUntil,'yyyy-MM-dd HH:mm') : 'None'}"></td>
                    <td th:text="${user.lastLoginAt != null ? #temporals.format(user.lastLoginAt,'yyyy-MM-dd HH:mm') : 'Never'}"></td>
                    <td>
                        <!-- Status Update Form -->
                        <form th:action="@{/admin/users/{id}/status(id=${user.userId})}" method="post" style="margin-bottom: 6px;">
                            <div style="display: flex; gap: 4px;">
                                <select name="status" style="width: auto; padding: 4px 8px; margin: 0;">
                                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                            th:selected="${s == user.accountStatus}">
                                    </option>
                                </select>
                                <button class="btn secondary" type="submit" style="padding: 4px 8px; font-size: 12px;">Save</button>
                            </div>
                        </form>

                        <!-- Unlock Form (if locked) -->
                        <form th:if="${user.accountStatus.name() == 'LOCKED'}"
                              th:action="@{/admin/users/{id}/unlock(id=${user.userId})}" method="post" style="margin-bottom: 6px;">
                            <button class="btn" type="submit" style="background: #10b981; padding: 4px 8px; font-size: 12px; width: 100%;">
                                Unlock Account
                            </button>
                        </form>

                        <!-- Add Role Form -->
                        <form th:action="@{/admin/users/{id}/role(id=${user.userId})}" method="post">
                            <div style="display: flex; gap: 4px;">
                                <select name="roleId" style="width: auto; padding: 4px 8px; margin: 0;">
                                    <option th:each="r : ${roles}" th:value="${r.roleId}" th:text="${r.roleName}"></option>
                                </select>
                                <button class="btn" type="submit" style="padding: 4px 8px; font-size: 12px;">Add Role</button>
                            </div>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
