spring.application.name=helpdesk
app.seed.demo=${SEED_DEMO_DATA:false}
app.seed.demo-password=${DEMO_PASSWORD:}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/university_helpdesk}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${SERVER_PORT:8080}
# Resolution targets in elapsed hours, measured from submission using current priority.
app.sla.low-hours=${SLA_LOW_HOURS:120}
app.sla.medium-hours=${SLA_MEDIUM_HOURS:72}
app.sla.high-hours=${SLA_HIGH_HOURS:24}
app.sla.critical-hours=${SLA_CRITICAL_HOURS:4}
app.sla.alerts.enabled=${SLA_ALERTS_ENABLED:true}
app.sla.alerts.delay=${SLA_ALERTS_DELAY:300000}

# Local development only. Set SHOW_RESET_LINK=false outside local development.
app.security.show-reset-link=${SHOW_RESET_LINK:false}
app.public-url=${APP_PUBLIC_URL:http://localhost:${server.port:8080}}

# Multipart file upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Attachment upload directory
app.upload-dir=uploads

# Email Configuration
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.scheduler.enabled=${MAIL_SCHEDULER_ENABLED:true}

app.mail.scheduler.delay=${MAIL_SCHEDULER_DELAY:10000}
# Authenticated STARTTLS by default (Gmail: port 587).
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLED:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
# Never enable protocol/auth debugging: responses may contain sensitive data.
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.debug.auth=false
