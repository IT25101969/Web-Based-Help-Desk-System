spring.application.name=helpdesk

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/university_helpdesk}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Local development only. Set SHOW_RESET_LINK=false outside local development.
app.security.show-reset-link=${SHOW_RESET_LINK:true}

# Email Configuration
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:helpdesk@university.edu}
app.mail.scheduler.enabled=${MAIL_SCHEDULER_ENABLED:true}
